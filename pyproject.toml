[build-system]
requires = [
    "setuptools>=75",
    "wheel",
    "torch",
    "ninja",
]
build-backend = "setuptools.build_meta"


[project]
name = "friendly-splat"
version = "0.1.0"
description = "User-friendly Gaussian Splatting toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.13"

license = { file = "LICENSE" }

authors = [
    { name = "FriendlySplat Authors" },
]

dependencies = [
    # Numerical stack
    "numpy>=2.0,<3",
    "scipy>=1.13",

    # PyTorch
    "torch==2.4.1",
    "torchvision==0.19.1",

    # CLI / configuration
    "tyro>=0.8.8",
    "PyYAML>=6",
    "rich>=12",
    "typing-extensions>=4.4",

    # Training / logging
    "tensorboard",
    "torchmetrics",
    "tqdm",

    # Imaging
    "imageio",
    "Pillow",
    "opencv-python",

    # Native-extension build helper
    "ninja",
]


[project.optional-dependencies]

train = [
    "fused-ssim",
    "fused-bilagrid",
    "scikit-learn",
]

viewer = [
    "jaxtyping",
    "viser",
    "matplotlib",
    "splines",
    "nerfview",
]

mesh = [
    "open3d>=0.19.0,<0.20",
    "scikit-image",
]

segment = [
    "networkx",
    "open3d>=0.19.0,<0.20",
]

sfm = [
    "huggingface-hub",
    "pycolmap==3.13.0",
    "safetensors",
]

priors = [
    "moge",
    "open3d>=0.19.0,<0.20",
    "scikit-learn",
]

dev = [
    "pytest",
    "ruff",
]


[project.scripts]
fs-train = "friendly_splat.train_app:main"
fs-view = "friendly_splat.view_app:entrypoint"
fs-sfm = "tools.sfm.run_hloc_sfm:entrypoint"
fs-mesh = "tools.mesh.tsdf_mesh_from_ply:entrypoint"
fs-segment = "tools.segment.instascene_gauscluster:entrypoint"
fs-prior-moge = "tools.geometry_prior.moge_infer:entrypoint"


# ---------------------------------------------------------------------------
# setuptools
# ---------------------------------------------------------------------------

[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
include = [
    "friendly_splat*",
    "gsplat*",
    "tools*",
]

exclude = [
    "benchmarks*",
    "tests*",
]


# ---------------------------------------------------------------------------
# uv: PyTorch CUDA 12.4 index
# ---------------------------------------------------------------------------

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


# ---------------------------------------------------------------------------
# uv: package sources
# ---------------------------------------------------------------------------

[tool.uv.sources]

# PyTorch CUDA 12.4 wheels
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

# CUDA extensions
fused-ssim = {
    git = "https://github.com/rahul-goel/fused-ssim",
    rev = "328dc9836f513d00c4b5bc38fe30478b4435cbb5",
}

fused-bilagrid = {
    git = "https://github.com/harry7557558/fused-bilagrid",
    rev = "49f0ef06c9f81810fb9b5dd9027cf1844950cc16",
}

# Viewer
nerfview = {
    git = "https://github.com/nerfstudio-project/nerfview",
    rev = "4538024fe0d15fd1a0e4d760f3695fc44ca72787",
}

# MoGe 2
#
# Pin before the MoGe 3 transition, which introduced its own cu130
# PyTorch source and conflicts with FriendlySplat's cu124 stack.
moge = {
    git = "https://github.com/microsoft/MoGe.git",
    rev = "07444410f1e33f402353b99d6ccd26bd31e469e8",
}


# ---------------------------------------------------------------------------
# uv: extra isolated-build dependencies
# ---------------------------------------------------------------------------

[tool.uv.extra-build-dependencies]

# FriendlySplat's setup/build code imports torch while discovering/building
# native extensions.
friendly-splat = [
    { requirement = "torch", match-runtime = true },
    "setuptools",
    "wheel",
    "ninja",
]

# fused-ssim builds a torch CUDA/C++ extension.
fused-ssim = [
    { requirement = "torch", match-runtime = true },
    "setuptools",
    "wheel",
    "ninja",
]

# fused-bilagrid builds a torch CUDA/C++ extension.
fused-bilagrid = [
    { requirement = "torch", match-runtime = true },
    "setuptools",
    "wheel",
    "ninja",
]